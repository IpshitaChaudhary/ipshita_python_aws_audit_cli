name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.8"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest --cov=aws_audit --cov-report=term-missing
      - name: CLI smoke test
        run: |
          aws-audit --version
          aws-audit list-checks

  ci-passed:
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: |
          [ "${{ needs.lint.result }}" = success ] && [ "${{ needs.test.result }}" = success ]
