[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-audit"
description = "Small CLI that audits an AWS account for common hardening gaps"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ipshita Chaudhary" }]
requires-python = ">=3.10"
dependencies = ["boto3>=1.34"]
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
dev = ["moto[s3]>=5.0", "pytest>=8", "pytest-cov>=5", "ruff>=0.8"]

[project.scripts]
aws-audit = "aws_audit.cli:main"

[tool.setuptools.dynamic]
version = { attr = "aws_audit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
